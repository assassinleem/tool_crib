<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool Crib</title>
<style>
  :root {
    --bg:        #121214;
    --surface:   #1b1b1f;
    --surface-2: #232329;
    --border:    #2e2e35;
    --text:      #e8e6e3;
    --text-2:    #a3a09b;
    --accent:    #b91c2e;
    --accent-hi: #e6394f;
    --low:       #ff5d5d;
    --warn:      #d99a2b;
    --ok:        #3fae6a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .mono {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---- Layout: left rail on desktop, bottom bar on phone ---- */

  .app {
    display: grid;
    grid-template-columns: 200px 1fr;
    height: 100%;
  }

  .rail {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px 0;
  }

  .rail-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 6px 16px 14px;
  }

  .rail-title .crib { color: var(--accent-hi); }

  .nav { display: flex; flex-direction: column; }

  .nav-btn {
    display: block;
    text-align: left;
    padding: 10px 16px;
    color: var(--text-2);
    border-left: 3px solid transparent;
    transition: background 120ms, color 120ms;
  }

  .nav-btn:hover {
    background: var(--surface-2);
    color: var(--text);
  }

  .nav-btn[aria-current="page"] {
    color: var(--text);
    border-left-color: var(--accent);
    background: var(--surface-2);
    font-weight: 600;
  }

  main {
    overflow-y: auto;
    padding: 20px 24px;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  .screen h1 {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .empty-state {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 40px 24px;
    text-align: center;
    color: var(--text-2);
  }

  /* ---- Decals ---- */

  .decal {
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---- Family/type picker ---- */

  .context-strip {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 46px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
  }

  .context-label { font-weight: 600; }
  .context-hint  { color: var(--text-2); }

  .seg {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .seg-btn {
    padding: 5px 12px;
    color: var(--text-2);
    border-right: 1px solid var(--border);
    transition: background 120ms, color 120ms;
  }

  .seg-btn:last-child { border-right: none; }
  .seg-btn:hover { background: var(--surface-2); color: var(--text); }
  .seg-btn.active { background: var(--accent); color: #fff; }

  .picker-section-title {
    color: var(--text-2);
    font-size: 13px;
    margin: 18px 0 8px;
  }

  .picker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
    gap: 10px;
  }

  .type-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 6px 10px;
    font-size: 13px;
    transition: background 120ms, border-color 120ms;
  }

  .type-card:hover { background: var(--surface-2); }

  .type-card.selected {
    border-color: var(--accent);
    background: var(--surface-2);
  }

  .type-card .decal { width: 30px; height: 30px; color: var(--text-2); }
  .type-card.selected .decal { color: var(--accent-hi); }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }

    .rail {
      /* rail becomes a fixed bottom bar */
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 10;
      flex-direction: row;
      align-items: stretch;
      padding: 0;
      border-right: none;
      border-top: 1px solid var(--border);
    }

    .rail-title { display: none; }

    .nav {
      flex-direction: row;
      width: 100%;
    }

    .nav-btn {
      flex: 1;
      text-align: center;
      padding: 12px 4px;
      font-size: 13px;
      border-left: none;
      border-top: 3px solid transparent;
    }

    .nav-btn[aria-current="page"] { border-top-color: var(--accent); }

    main { padding-bottom: 64px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="rail">
    <div class="rail-title">Tool <span class="crib">Crib</span></div>
    <nav class="nav" aria-label="Main">
      <button class="nav-btn" data-screen="crib">Crib</button>
      <button class="nav-btn" data-screen="add">Add Tools</button>
      <button class="nav-btn" data-screen="tagout">Tag-Out</button>
      <button class="nav-btn" data-screen="ordering">Needs Ordering</button>
      <button class="nav-btn" data-screen="log">Log</button>
    </nav>
  </div>

  <main>
    <section class="screen" id="screen-crib">
      <h1>Crib</h1>
      <div class="empty-state">No items yet.</div>
    </section>

    <section class="screen" id="screen-add">
      <h1>Add Tools</h1>
      <div id="add-picker"></div>
    </section>

    <section class="screen" id="screen-tagout">
      <h1>Tag-Out</h1>
      <div class="empty-state">No open tickets.</div>
    </section>

    <section class="screen" id="screen-ordering">
      <h1>Needs Ordering</h1>
      <div class="empty-state">Nothing needs ordering.</div>
    </section>

    <section class="screen" id="screen-log">
      <h1>Log</h1>
      <div class="empty-state">No log events.</div>
    </section>
  </main>
</div>

<script src="categories.js"></script>
<script>
"use strict";

const SCREENS = ["crib", "add", "tagout", "ordering", "log"];
const DEFAULT_SCREEN = "crib";

function showScreen(name) {
  if (!SCREENS.includes(name)) name = DEFAULT_SCREEN;
  for (const s of SCREENS) {
    document.getElementById("screen-" + s)
      .classList.toggle("active", s === name);
  }
  for (const btn of document.querySelectorAll(".nav-btn")) {
    if (btn.dataset.screen === name) {
      btn.setAttribute("aria-current", "page");
    } else {
      btn.removeAttribute("aria-current");
    }
  }
}

// The hash is the router: #crib, #add, ... so refresh and back/forward
// keep your place, and the app still works from a file:// URL.
function screenFromHash() {
  return location.hash.replace("#", "") || DEFAULT_SCREEN;
}

for (const btn of document.querySelectorAll(".nav-btn")) {
  btn.addEventListener("click", () => {
    location.hash = btn.dataset.screen;
  });
}

window.addEventListener("hashchange", () => showScreen(screenFromHash()));

showScreen(screenFromHash());

/* ---- Family/type picker ----
   Isolated component; step 4's survey form builds around it. Renders
   entirely from window.CATEGORIES — no family names appear in this code. */

function decalSvg(id) {
  return '<svg class="decal" aria-hidden="true"><use href="#' + id + '"/></svg>';
}

function buildTypePicker(container, onChange) {
  const sel = { family: null, type: null, substrate: null };

  const strip = document.createElement("div");
  strip.className = "context-strip";
  container.appendChild(strip);

  for (const fam of window.CATEGORIES.families.filter(f => f.enabled)) {
    const title = document.createElement("div");
    title.className = "picker-section-title";
    title.textContent = fam.label;
    container.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "picker-grid";
    container.appendChild(grid);

    for (const type of fam.types) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "type-card";
      card.innerHTML = decalSvg(type.decal) + "<span>" + type.label + "</span>";
      card._pick = { fam, type };
      card.addEventListener("click", () => {
        const familyChanged = sel.family !== fam;
        sel.family = fam;
        sel.type = type;
        // Substrate resets to the family default when the family changes,
        // otherwise the operator's pick persists across entries (4.2).
        if (!fam.substrate) {
          sel.substrate = null;
        } else if (familyChanged || sel.substrate === null) {
          sel.substrate = fam.substrate.default;
        }
        refresh();
      });
      grid.appendChild(card);
    }
  }

  function refresh() {
    for (const card of container.querySelectorAll(".type-card")) {
      card.classList.toggle("selected",
        sel.family === card._pick.fam && sel.type === card._pick.type);
    }
    renderStrip();
    if (onChange) onChange(getSelection());
  }

  function renderStrip() {
    strip.textContent = "";

    const label = document.createElement("div");
    if (!sel.family) {
      label.className = "context-hint";
      label.textContent = "Pick a type below.";
      strip.appendChild(label);
      return;
    }
    label.className = "context-label";
    label.textContent = sel.family.label + " · " + sel.type.label;
    strip.appendChild(label);

    const sub = sel.family.substrate;
    if (sub && sub.mode === "visible") {
      const seg = document.createElement("div");
      seg.className = "seg";
      for (const opt of sub.options) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "seg-btn" + (opt === sel.substrate ? " active" : "");
        btn.textContent = opt;
        btn.addEventListener("click", () => { sel.substrate = opt; refresh(); });
        seg.appendChild(btn);
      }
      strip.appendChild(seg);
    } else if (sub) {
      // Hidden-mode substrate (endmills -> carbide) still applies; show it
      // quietly so the context strip tells the whole truth.
      const note = document.createElement("div");
      note.className = "context-hint";
      note.textContent = sel.substrate;
      strip.appendChild(note);
    }
  }

  function getSelection() {
    return {
      family: sel.family ? sel.family.key : null,
      type: sel.type ? sel.type.key : null,
      substrate: sel.substrate
    };
  }

  renderStrip();
  return { getSelection };
}

if (window.CATEGORIES) {
  buildTypePicker(document.getElementById("add-picker"), null);
} else {
  document.getElementById("add-picker").textContent =
    "categories.js failed to load — it must sit in the same folder as index.html.";
}
</script>

</body>
</html>
